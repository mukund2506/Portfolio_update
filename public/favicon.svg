<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#031d44"/>
    </linearGradient>

    <!-- Vibrant Salesforce Cyan to Azure Gradient for Letters -->
    <linearGradient id="letterMGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="letterJGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows for 3D depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with smooth rounded corners -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Subtle outer glow / neon highlight border -->
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="10"/>

  <!-- Glow effect behind letters -->
  <g filter="url(#glow)" opacity="0.25">
    <!-- M silhouette -->
    <path d="M 96 360 L 96 156 L 152 156 L 210 268 L 268 156 L 324 156 L 324 360 L 276 360 L 276 226 L 226 322 L 194 322 L 144 226 L 144 360 Z" fill="#38bdf8"/>
    <!-- J silhouette -->
    <path d="M 346 156 L 416 156 L 416 312 C 416 352 388 380 344 380 C 314 380 292 368 280 348 L 316 318 C 324 330 334 336 346 336 C 362 336 370 326 370 308 L 370 200 L 346 200 Z" fill="#67e8f9"/>
  </g>

  <!-- Sharp, geometric "MJ" Monogram -->
  <g filter="url(#shadow)">
    <!-- Letter 'M' -->
    <path d="M 96 360 L 96 156 L 152 156 L 210 268 L 268 156 L 324 156 L 324 360 L 276 360 L 276 226 L 226 322 L 194 322 L 144 226 L 144 360 Z" 
          fill="url(#letterMGrad)"/>

    <!-- Letter 'J' with curved tail and top terminal -->
    <path d="M 346 156 L 416 156 L 416 310 C 416 354 388 380 344 380 C 312 380 290 366 278 344 L 316 314 C 324 328 334 336 346 336 C 362 336 370 324 370 306 L 370 200 L 346 200 Z" 
          fill="url(#letterJGrad)"/>
  </g>

  <!-- Accent dot / tech spark (Salesforce cyan glow node) -->
  <circle cx="416" cy="156" r="14" fill="#38bdf8" filter="url(#shadow)"/>
  <circle cx="416" cy="156" r="6" fill="#ffffff"/>
</svg>
